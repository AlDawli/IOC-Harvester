[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioc-harvester"
version = "1.0.0"
description = "Threat intelligence aggregator: pull IOCs from Abuse.ch, AlienVault OTX & ThreatFox; export to CSV, Sigma and firewall blocklists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "IOC Harvester" }]
keywords = ["threat-intelligence", "ioc", "cybersecurity", "sigma", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
ioc-harvester = "ioc_harvester.cli:main"

[project.urls]
Homepage = "https://github.com/example/ioc-harvester"
Issues = "https://github.com/example/ioc-harvester/issues"

[tool.hatch.build.targets.wheel]
packages = ["ioc_harvester"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
